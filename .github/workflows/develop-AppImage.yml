name: Build AppImage (develop)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-appimage:
    runs-on: ubuntu-22.04

    container:
      image: debian:11

    steps:
      - name: Configure Debian repositories
        run: |
          cat > /etc/apt/sources.list <<'EOF'
          deb http://archive.debian.org/debian bullseye main
          deb http://archive.debian.org/debian bullseye-updates main
          deb http://archive.debian.org/debian bullseye-backports main
          deb http://archive.debian.org/debian-security bullseye-security main
          EOF

          apt-get -o Acquire::Check-Valid-Until=false update

      - name: Install build dependencies
        run: |
          apt-get install -y \
            build-essential \
            qt6-base-dev \
            qt6-svg-dev \
            libgl-dev \
            cmake \
            curl \
            file \
            git

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Trust checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure project
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build --parallel

      - name: Install project into AppDir
        run: |
          DESTDIR="$GITHUB_WORKSPACE/packaging/AppDir" \
            cmake --install build --prefix /usr

      - name: Install linuxdeploy
        run: |
          mkdir -p "$HOME/.local/bin"

          curl -fL \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage \
            -o "$HOME/.local/bin/linuxdeploy"

          curl -fL \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage \
            -o "$HOME/.local/bin/linuxdeploy-plugin-qt"

          chmod +x \
            "$HOME/.local/bin/linuxdeploy" \
            "$HOME/.local/bin/linuxdeploy-plugin-qt"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build AppImage
        run: |
          # Debian 11 run in a container,
          # so FUSE is unavailable
          export APPIMAGE_EXTRACT_AND_RUN=1
          linuxdeploy \
            --appdir packaging/AppDir/ \
            --plugin qt \
            --output appimage

      - name: Show package
        run: ls -lh *.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: libvirt-snapshot-manager-develop
          path: "*.AppImage"
          if-no-files-found: error
          retention-days: 7
